name: rdna-ci-reusable

# Called by the per-line workflows; never triggered on its own.
on:
  workflow_call:
    inputs:
      line:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'vivienfanghuagood/sglang'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arch: [gfx1201, gfx1100]
    runs-on: [self-hosted, sglang-rdna, "${{ matrix.arch }}"]
    timeout-minutes: 90
    name: ${{ matrix.arch }} / ${{ inputs.line }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rdna-ci
          persist-credentials: false
      - name: Build, kernel tests, serve smoke test
        env:
          LINE: ${{ inputs.line }}
        run: |
          export RDNA_CI_RESULT_DIR="$RUNNER_TEMP/result"
          "$RDNA_CI_RUN" "$LINE"
      - name: Report
        if: always()
        run: python3 ci/report.py "$RUNNER_TEMP/result" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.arch }}-${{ inputs.line }}
          path: ${{ runner.temp }}/result/public
          retention-days: 30
      - name: Verdict
        run: python3 ci/report.py --verdict "$RUNNER_TEMP/result"
