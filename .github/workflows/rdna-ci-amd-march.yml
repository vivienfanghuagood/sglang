name: rdna-ci amd_march

# Daily RDNA smoke test of upstream sglang (amd_march) on self-hosted Radeon runners.
# Only scheduled and manual runs: no pull_request, pull_request_target or issue_comment
# triggers, so code from outside this fork never reaches the runners.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdna-ci-amd-march
  cancel-in-progress: false

jobs:
  rdna:
    uses: ./.github/workflows/rdna-ci-reusable.yml
    with:
      line: amd_march
