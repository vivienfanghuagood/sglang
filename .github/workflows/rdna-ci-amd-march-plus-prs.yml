name: rdna-ci amd_march-plus-prs

# Daily RDNA smoke test of upstream sglang (amd_march-plus-prs) on self-hosted Radeon runners.
# Manual runs only, dispatched daily at a fixed time by the runner owner. There is no schedule,
# pull_request, pull_request_target or issue_comment trigger, so code from outside this fork
# never reaches the runners.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdna-ci-amd-march-plus-prs
  cancel-in-progress: false

jobs:
  rdna:
    uses: ./.github/workflows/rdna-ci-reusable.yml
    with:
      line: amd_march-plus-prs
